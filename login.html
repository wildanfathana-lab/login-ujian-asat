<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Login Ujian ASAT | SMP PGRI 1 CIBINONG</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at 20% 30%, #0a0a0a, #030303);
            background-color: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        .vector-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .vector-bg svg {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0.12;
        }

        .login-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 500px;
            background: rgba(10, 10, 15, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 3rem;
            border: 1px solid rgba(255, 200, 80, 0.5);
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 200, 100, 0.2) inset;
            padding: 2rem 1.8rem 2.2rem;
        }

        .logo-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 1.4rem;
        }

        .logo-svg {
            width: 85px;
            height: 85px;
            background: rgba(255, 220, 100, 0.12);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 0.8rem;
            border: 2px solid rgba(255, 200, 70, 0.6);
            padding: 12px;
        }

        .school-name {
            font-size: 1.45rem;
            font-weight: 700;
            background: linear-gradient(135deg, #FFF8E7, #FFD966);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-align: center;
        }

        .exam-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #FFE3A4;
            text-align: center;
            border-top: 1px dashed rgba(255, 200, 100, 0.4);
            margin-top: 10px;
            padding-top: 10px;
        }

        .year {
            font-size: 0.85rem;
            color: #FFD966;
            background: rgba(0,0,0,0.4);
            display: inline-block;
            padding: 0.2rem 1rem;
            border-radius: 40px;
            margin-top: 6px;
        }

        .input-group {
            margin-bottom: 1.8rem;
        }

        label {
            display: block;
            color: #FFE3A4;
            font-weight: 500;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        .input-field {
            width: 100%;
            padding: 14px 18px;
            background: #121212;
            border: 1.5px solid #2c2c2c;
            border-radius: 2rem;
            font-size: 1rem;
            color: #f0f0f0;
            transition: all 0.2s;
            outline: none;
        }

        .input-field:focus {
            border-color: #FFC857;
            box-shadow: 0 0 0 3px rgba(255, 200, 80, 0.3);
            background: #1a1a1a;
        }

        .login-btn {
            width: 100%;
            background: linear-gradient(95deg, #FFC857, #FFA41E);
            border: none;
            padding: 14px 18px;
            border-radius: 3rem;
            font-weight: 700;
            font-size: 1.1rem;
            color: #0a0a0a;
            cursor: pointer;
            transition: all 0.25s;
            box-shadow: 0 5px 12px rgba(255, 180, 50, 0.3);
        }

        .login-btn:hover {
            transform: scale(1.01);
            background: linear-gradient(95deg, #FFD46E, #FFB42E);
        }

        .info-stat {
            display: flex;
            justify-content: space-between;
            margin-top: 1.5rem;
            background: rgba(0, 0, 0, 0.6);
            padding: 0.8rem 1rem;
            border-radius: 2rem;
            font-size: 0.8rem;
            color: #CBCBCB;
            border: 1px solid rgba(255,200,100,0.3);
        }

        .info-stat span {
            color: #FFD966;
            font-weight: 700;
        }

        .error-message {
            background: rgba(230, 70, 60, 0.2);
            border-left: 4px solid #FF6A5C;
            padding: 12px 16px;
            border-radius: 1.5rem;
            font-size: 0.85rem;
            color: #FFB3A8;
            margin-bottom: 1.5rem;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .footer-note {
            text-align: center;
            font-size: 0.7rem;
            margin-top: 1.6rem;
            color: #7f7f7f;
        }

        @media (max-width: 500px) {
            .login-container { padding: 1.5rem; }
            .school-name { font-size: 1.2rem; }
        }
    </style>
</head>
<body>
<div class="vector-bg">
    <svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" style="position:absolute; opacity:0.1">
        <defs>
            <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
                <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFC857" stroke-width="0.8"/>
            </pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#grid)" />
    </svg>
</div>

<div class="login-container">
    <div class="logo-area">
        <div class="logo-svg">
            <svg width="52" height="52" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 3L3 8L12 13L21 8L12 3Z" stroke="#FFD966" stroke-width="1.4" stroke-linejoin="round" fill="none"/>
                <path d="M5 13L5 18L12 22L19 18L19 13" stroke="#FFD966" stroke-width="1.4" fill="none"/>
                <circle cx="12" cy="13" r="1.5" fill="#FFD966" stroke="none"/>
                <path d="M12 8V12" stroke="#FFD966" stroke-width="1.2"/>
            </svg>
        </div>
        <div class="school-name">SMP PGRI 1 CIBINONG</div>
        <div class="exam-title">ASESMEN SUMATIF AKHIR TAHUN</div>
        <div class="year">TAHUN AJARAN 2025/2026</div>
    </div>

    <div id="errorBox" class="error-message">
        ⚠️ <span id="errorText">ID Peserta atau Password salah.</span>
    </div>

    <form id="loginForm" autocomplete="off">
        <div class="input-group">
            <label>🆔 ID Peserta</label>
            <input type="text" id="username" class="input-field" placeholder="Contoh: P001, P430, P844" autocomplete="off" required>
        </div>
        <div class="input-group">
            <label>🔐 Password / PIN Akses</label>
            <input type="password" id="password" class="input-field" placeholder="Masukkan password unik" autocomplete="off" required>
        </div>
        <button type="submit" id="submitBtn" class="login-btn">➡️ MASUK UJIAN</button>
    </form>

    <div class="info-stat">
        <div>📘 Kelas 7 <span>430 siswa</span></div>
        <div>📙 Kelas 8 <span>414 siswa</span></div>
        <div>📋 Total <span>844 akun</span></div>
    </div>
    <div class="footer-note">
        * Gunakan ID Peserta (P001 - P844) dan password rahasia dari sekolah
    </div>
</div>

<script>
    // ============================================================
    // KONFIGURASI
    // ============================================================
    const API_URL = 'https://login-ujian-asat.vercel.app/api/validate';
    
    // ⚠️ PERBAIKI URL INI - Ganti dengan halaman ujian yang benar!
    const REDIRECT_URL = 'https://sites.google.com/view/final-exam-v2025/pembagian-hari?authuser=1';
    
    // ============================================================
    // SCRIPT LOGIN - DENGAN PERBAIKAN SESSION
    // ============================================================
    
    const form = document.getElementById('loginForm');
    const submitBtn = document.getElementById('submitBtn');
    const errorBox = document.getElementById('errorBox');
    const errorTextSpan = document.getElementById('errorText');
    let isProcessing = false;

    // Hapus session storage saat halaman dimuat (refresh)
    window.addEventListener('load', function() {
        sessionStorage.clear();
    });

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        if (isProcessing) return;
        
        errorBox.classList.remove('show');
        
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const id_peserta = usernameInput.value.trim().toUpperCase();
        const password = passwordInput.value;
        
        if (!id_peserta || !password) {
            errorTextSpan.innerText = 'ID Peserta dan Password wajib diisi.';
            errorBox.classList.add('show');
            return;
        }
        
        // Validasi format ID (P001 - P844)
        const idRegex = /^P(\d{3,4})$/;
        const match = id_peserta.match(idRegex);
        if (!match) {
            errorTextSpan.innerText = 'Format ID Peserta salah. Gunakan format P001 hingga P844.';
            errorBox.classList.add('show');
            return;
        }
        
        const idNumber = parseInt(match[1], 10);
        if (idNumber < 1 || idNumber > 844) {
            errorTextSpan.innerText = 'ID Peserta tidak valid (hanya P001 - P844).';
            errorBox.classList.add('show');
            return;
        }
        
        isProcessing = true;
        submitBtn.innerHTML = '⏳ Memverifikasi...';
        submitBtn.disabled = true;
        
        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id_peserta, password })
            });
            
            const result = await response.json();
            
            if (result.success) {
                // ✅ LOGIN SUKSES
                // Hapus session lama sebelum menyimpan yang baru
                sessionStorage.clear();
                sessionStorage.setItem('logged_in_as', id_peserta);
                sessionStorage.setItem('kelas', result.data.kelas);
                
                // Redirect ke halaman ujian
                window.location.href = REDIRECT_URL + '?id=' + encodeURIComponent(id_peserta);
            } else {
                // ❌ LOGIN GAGAL - Hapus semua session storage
                sessionStorage.clear();
                
                errorTextSpan.innerText = result.message || 'ID Peserta atau Password salah.';
                errorBox.classList.add('show');
                passwordInput.value = '';
                passwordInput.focus();
            }
        } catch (error) {
            console.error('Error:', error);
            errorTextSpan.innerText = 'Gagal terhubung ke server. Periksa koneksi Anda.';
            errorBox.classList.add('show');
            sessionStorage.clear();
        } finally {
            isProcessing = false;
            submitBtn.innerHTML = '➡️ MASUK UJIAN';
            submitBtn.disabled = false;
        }
    });
</script>
</body>
</html>
