<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Login Ujian ASAT | SMP PGRI 1 CIBINONG</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at 20% 30%, #0a0a0a, #030303);
            background-color: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        .vector-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .vector-bg svg {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0.12;
        }

        .login-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 500px;
            background: rgba(10, 10, 15, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 3rem;
            border: 1px solid rgba(255, 200, 80, 0.5);
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 200, 100, 0.2) inset;
            padding: 2rem 1.8rem 2.2rem;
        }

        .logo-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 1.4rem;
        }

        .logo-svg{
    display:flex;
    justify-content:center;
    margin-bottom:10px;
}

.logo-img{
    width:120px;
}

        .school-name {
    font-size: clamp(18px, 5vw, 34px);
    font-weight: 700;
    background: linear-gradient(135deg, #FFF8E7, #FFD966);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-align: center;
    white-space: nowrap;
}

.exam-title {
    font-size: clamp(10px, 3vw, 22px);
    font-weight: 600;
    color: #FFE3A4;
    text-align: center;
    border-top: 1px dashed rgba(255, 200, 100, 0.4);
    margin-top: 10px;
    padding-top: 10px;
    width: 100%;
    line-height: 1.2;
    white-space: nowrap;
}

.year {
    font-size: clamp(11px, 3vw, 16px);
    color: #FFD966;
    background: rgba(0,0,0,0.4);
    display: inline-block;
    padding: 0.2rem 1rem;
    border-radius: 40px;
    margin-top: 6px;
    white-space: nowrap;
}
.input-group{
    margin-bottom:16px;
}

.input-group label{
    display:block;
    margin-bottom:8px;
    color:#FFE3A4;
    font-size:14px;
    font-weight:600;
}

.input-field{
    width:100%;
    padding:14px 16px;
    border-radius:16px;
    border:1px solid rgba(255,200,100,0.35);
    background:rgba(255,255,255,0.06);
    color:white;
    font-size:15px;
    outline:none;
}

.input-field:focus{
    border-color:#FFD966;
    box-shadow:0 0 10px rgba(255,217,102,0.25);
}

.login-btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:18px;
    margin-top:8px;
    background:linear-gradient(135deg,#FFD966,#FFB800);
    color:#111;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    transition:0.2s;
}

.login-btn:hover{
    transform:translateY(-1px);
}

.login-btn:disabled{
    opacity:0.7;
    cursor:not-allowed;
}

.error-message{
    display:none;
    background:rgba(255,80,80,0.12);
    border:1px solid rgba(255,80,80,0.35);
    color:#FFD5D5;
    padding:12px;
    border-radius:14px;
    margin-bottom:16px;
    font-size:14px;
}

.error-message.show{
    display:block;
}

.info-stat{
    margin-top:18px;
    color:#FFE3A4;
    font-size:13px;
    display:flex;
    flex-direction:column;
    gap:6px;
}

.info-stat div{
    display:flex;
    justify-content:space-between;
}

.footer-note{
    margin-top:16px;
    font-size:12px;
    color:#ccc;
    text-align:center;
    line-height:1.5;
}
        @media (max-width: 500px) {
    .login-container { padding: 1.5rem; }

    .school-name { font-size: 1.2rem; }

    .logo-img{
        width:90px;
    }
}
    </style>
</head>
<body>
<div class="vector-bg">
    <svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" style="position:absolute; opacity:0.1">
        <defs>
            <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
                <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFC857" stroke-width="0.8"/>
            </pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#grid)" />
    </svg>
</div>

<div class="login-container">
    <div class="logo-area">
        <div class="logo-svg">
    <img src="logo.png" alt="Logo YPLP PGRI" class="logo-img">
</div>
        <div class="school-name">SMP PGRI 1 CIBINONG</div>
        <div class="exam-title">ASESMEN SUMATIF AKHIR TAHUN</div>
        <div class="year">TAHUN AJARAN 2025/2026</div>
    </div>

    <div id="errorBox" class="error-message">
        ⚠️ <span id="errorText">ID Peserta atau Password salah.</span>
    </div>

    <form id="loginForm" autocomplete="off">
        <div class="input-group">
            <label>🆔 ID Peserta</label>
            <input type="text" id="username" class="input-field" placeholder="Contoh: P001, P430, P844" autocomplete="off" required>
        </div>
        <div class="input-group">
            <label>🔐 Password / PIN Akses</label>
            <input type="password" id="password" class="input-field" placeholder="Masukkan password unik" autocomplete="off" required>
        </div>
        <button type="submit" id="submitBtn" class="login-btn">➡️ MASUK UJIAN</button>
    </form>

    <div class="info-stat">
        <div>📘 Kelas 7 <span>430 siswa</span></div>
        <div>📙 Kelas 8 <span>414 siswa</span></div>
        <div>📋 Total <span>844 akun</span></div>
    </div>
    <div class="footer-note">
        * Gunakan ID Peserta (P001 - P844) dan password rahasia dari sekolah
    </div>
</div>

<script>
    // ============================================================
    // KONFIGURASI
    // ============================================================
    const API_URL = "https://login-ujian-asat-backend.vercel.app/api/validate";
    
    // ⚠️ PERBAIKI URL INI - Ganti dengan halaman ujian yang benar!
    const REDIRECT_URL = 'https://sites.google.com/view/smppgri1cibinong/home-ios';
    
    // ============================================================
    // SCRIPT LOGIN - DENGAN PERBAIKAN SESSION
    // ============================================================
    
    const form = document.getElementById('loginForm');
    const submitBtn = document.getElementById('submitBtn');
    const errorBox = document.getElementById('errorBox');
    const errorTextSpan = document.getElementById('errorText');
    let isProcessing = false;

    // Hapus session storage saat halaman dimuat (refresh)
    window.addEventListener('load', function() {
        sessionStorage.clear();
    });

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        if (isProcessing) return;
        
        errorBox.classList.remove('show');
        
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const id_peserta = usernameInput.value.trim().toUpperCase();
        const password = passwordInput.value;
        
        if (!id_peserta || !password) {
            errorTextSpan.innerText = 'ID Peserta dan Password wajib diisi.';
            errorBox.classList.add('show');
            return;
        }
        
        // Validasi format ID (P001 - P844)
        const idRegex = /^P(\d{3,4})$/;
        const match = id_peserta.match(idRegex);
        if (!match) {
            errorTextSpan.innerText = 'Format ID Peserta salah. Gunakan format P001 hingga P844.';
            errorBox.classList.add('show');
            return;
        }
        
        const idNumber = parseInt(match[1], 10);
        if (idNumber < 1 || idNumber > 844) {
            errorTextSpan.innerText = 'ID Peserta tidak valid (hanya P001 - P844).';
            errorBox.classList.add('show');
            return;
        }
        
        isProcessing = true;
        submitBtn.innerHTML = '⏳ Memverifikasi...';
        submitBtn.disabled = true;
form.querySelectorAll('input').forEach(el => el.disabled = true);
        // Delay acak 0.5 - 2 detik agar request tidak serentak
const randomDelay = Math.floor(Math.random() * 1500) + 500;

await new Promise(resolve => setTimeout(resolve, randomDelay));
        try {
            const controller = new AbortController();

const timeoutId = setTimeout(() => controller.abort(), 10000);

const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
    id: id_peserta,
    password: password
}),
signal: controller.signal
});

clearTimeout(timeoutId);
            
            const result = await response.json();
            
            if (result.success) {
                // ✅ LOGIN SUKSES
                // Hapus session lama sebelum menyimpan yang baru
                sessionStorage.clear();
                sessionStorage.setItem('logged_in_as', id_peserta);
                sessionStorage.setItem('kelas', result.data?.kelas || '');
                
                // Redirect ke halaman ujian
                window.location.href = REDIRECT_URL + '?id=' + encodeURIComponent(id_peserta);
            } else {
                // ❌ LOGIN GAGAL - Hapus semua session storage
                sessionStorage.clear();
                
                errorTextSpan.innerText = result.message || 'ID Peserta atau Password salah.';
                errorBox.classList.add('show');
                passwordInput.value = '';
                passwordInput.focus();
            }
        } catch (error) {
    console.error('Error:', error);

    if (error.name === 'AbortError') {
        errorTextSpan.innerText = 'Server terlalu sibuk. Silakan coba lagi beberapa detik.';
    } else {
        errorTextSpan.innerText = 'Gagal terhubung ke server. Periksa koneksi Anda.';
    }
            errorBox.classList.add('show');
            sessionStorage.clear();
        } finally {
            isProcessing = false;
            submitBtn.innerHTML = '➡️ MASUK UJIAN';
            submitBtn.disabled = false;
form.querySelectorAll('input').forEach(el => el.disabled = false);
        }
    });

console.log("SCRIPT AKTIF");

// kode javascript login Anda di sini

</script>
</body>
</html>
